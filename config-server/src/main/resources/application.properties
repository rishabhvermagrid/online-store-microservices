server.port = 8888
#now eureka and gateway can indetify them
spring.application.name=config-server

#spring cloud config server by default expects a git repo to serve property files from,if we are developing locally without a remote Git repo, tell Config Server to use local classpath files (native profile).
#spring.profiles.active=native
#spring.cloud.config.server.native.search-locations=classpath:/config

spring.cloud.config.server.git.uri = https://github.com/rishabhvermagrid/online-store-config.git
spring.cloud.config.server.git.default-label = main
spring.cloud.config.server.git.clone-on-start = true

eureka.client.service-url.defaultZone = http://localhost:8761/eureka/